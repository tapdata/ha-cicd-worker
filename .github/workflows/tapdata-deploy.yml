name: TapData Deploy

on:
  push:
    branches: [main]
    paths:
      - '**/*tapdata_export/**'
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - sit
          - lpt
      project:
        description: 'Project name'
        required: true
        type: choice
        default: dmp
        options:
          - dmp

env:
  DEPLOY_DIR: /tmp/tapdata-deploy-${{ github.run_id }}
  # push 到 main 或创建 Tag 时使用 ref_name
  DEPLOY_REF: ${{ github.ref_name }}
  # push 到 main 时固定 dev；push 创建 Tag 时固定 sit；手动触发时使用 inputs.target_env
  TARGET_ENV: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'dev' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'sit' || inputs.target_env }}
  # 创建 Tag 触发时固定 dmp；其他场景默认 dmp 或使用手动输入
  PROJECT: ${{ inputs.project || 'dmp' }}

jobs:
  # ============================================================
  # Job 1: Preparation Phase
  # ============================================================
  preparation:
    name: Preparation Phase
    runs-on: self-hosted
    timeout-minutes: 5
    environment: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'dev' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'sit' || inputs.target_env }}
    outputs:
      tapdata_token: ${{ steps.get_token.outputs.tapdata_token }}
      target_env: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'dev' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'sit' || inputs.target_env }}
      tapdata_url: ${{ vars.TAPDATA_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate Input Parameters
        run: bash scripts/tapdata-deploy/validate-inputs.sh
        env:
          DEPLOYMENT_REF: ${{ env.DEPLOY_REF }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PROJECT: ${{ env.PROJECT }}

      - name: Get TapData Token
        id: get_token
        run: bash scripts/common/get-token.sh
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TAPDATA_ACCESSCODE: ${{ secrets.TAPDATA_ACCESS_CODE }}

      - name: Generate vault.json with Connection Secrets
        run: bash scripts/tapdata-deploy/generate-vault.sh
        env:
          PROJECT: ${{ env.PROJECT }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}

      - name: Upload vault and export files
        uses: actions/upload-artifact@v4
        with:
          name: vault-and-export
          path: |
            ${{ env.PROJECT }}_tapdata_export/vault.json
          retention-days: 1

  # ============================================================
  # Job 2: Preview Connections
  # ============================================================
  preview-connections:
    name: Preview Connections
    runs-on: self-hosted
    timeout-minutes: 5
    needs: preparation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Connections
        run: bash scripts/common/preview-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PREVIEW_MARKDOWN_OUTPUT: /tmp/preview-connections.md

      - name: Upload preview markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-md-connections
          path: /tmp/preview-connections.md
          retention-days: 1

  # ============================================================
  # Job 3: Deploy Connections (requires approval)
  # ============================================================
  deploy-connections:
    name: Deploy Connections
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-connections]
    outputs:
      changed_connections: ${{ steps.import_connections.outputs.changed_connections }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Connections (diff)
        run: bash scripts/common/preview-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Import Connections via TapData API
        id: import_connections
        run: bash scripts/common/import-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 4: Preview Migrate Tasks
  # ============================================================
  preview-migrate-tasks:
    name: Preview Migrate Tasks
    runs-on: self-hosted
    timeout-minutes: 5
    needs: [preparation, deploy-connections]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Migrate Tasks
        run: bash scripts/common/preview-resource.sh migrate/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PREVIEW_MARKDOWN_OUTPUT: /tmp/preview-migrate-tasks.md

      - name: Upload preview markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-md-migrate-tasks
          path: /tmp/preview-migrate-tasks.md
          retention-days: 1

  # ============================================================
  # Job 5: Deploy Migrate Tasks (requires approval)
  # ============================================================
  deploy-migrate-tasks:
    name: Deploy Migrate Tasks
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-migrate-tasks]
    outputs:
      changed_migrate_tasks: ${{ steps.import_migrate_tasks.outputs.changed_migrate_tasks }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Migrate Tasks (diff)
        run: bash scripts/common/preview-resource.sh migrate/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Import Migrate Tasks via TapData API
        id: import_migrate_tasks
        run: bash scripts/common/import-resource.sh migrate/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 6: Preview Sync Tasks
  # ============================================================
  preview-sync-tasks:
    name: Preview Sync Tasks
    runs-on: self-hosted
    timeout-minutes: 5
    needs: [preparation, deploy-migrate-tasks]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Sync Tasks
        run: bash scripts/common/preview-resource.sh sync/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PREVIEW_MARKDOWN_OUTPUT: /tmp/preview-sync-tasks.md

      - name: Upload preview markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-md-sync-tasks
          path: /tmp/preview-sync-tasks.md
          retention-days: 1

  # ============================================================
  # Job 7: Deploy Sync Tasks (requires approval)
  # ============================================================
  deploy-sync-tasks:
    name: Deploy Sync Tasks
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-sync-tasks]
    outputs:
      changed_sync_tasks: ${{ steps.import_sync_tasks.outputs.changed_sync_tasks }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Sync Tasks (diff)
        run: bash scripts/common/preview-resource.sh sync/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Import Sync Tasks via TapData API
        id: import_sync_tasks
        run: bash scripts/common/import-resource.sh sync/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 8: Preview APIs
  # ============================================================
  preview-apis:
    name: Preview APIs
    runs-on: self-hosted
    timeout-minutes: 5
    needs: [preparation, deploy-sync-tasks]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview APIs
        run: bash scripts/common/preview-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PREVIEW_MARKDOWN_OUTPUT: /tmp/preview-apis.md

      - name: Upload preview markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-md-apis
          path: /tmp/preview-apis.md
          retention-days: 1

  # ============================================================
  # Job 9: Deploy APIs (requires approval)
  # ============================================================
  deploy-apis:
    name: Deploy APIs
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-apis]
    outputs:
      changed_apis: ${{ steps.import_apis.outputs.changed_apis }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview APIs (diff)
        run: bash scripts/common/preview-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Import APIs via TapData API
        id: import_apis
        run: bash scripts/common/import-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 10: Deploy Group Info
  # ============================================================
  deploy-group-info:
    name: Deploy Group Info
    runs-on: self-hosted
    timeout-minutes: 15
    needs: [preparation, deploy-apis]
    outputs:
      changed_groupInfo: ${{ steps.import_group_info.outputs.changed_groupInfo }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Group Info via TapData API
        id: import_group_info
        run: bash scripts/common/import-resource.sh groupInfo
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 11: Deployment Summary (consolidated preview in reverse order)
  # ============================================================
  deployment-summary:
    name: Deployment Summary
    runs-on: self-hosted
    timeout-minutes: 5
    if: always()
    needs: [preparation, deploy-group-info]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download preview markdown artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: preview-md-*
          path: /tmp/preview-artifacts
          merge-multiple: false

      - name: Consolidate previews (reverse order)
        run: |
          bash scripts/common/consolidate-previews.sh \
            /tmp/preview-artifacts/preview-md-apis/preview-apis.md \
            /tmp/preview-artifacts/preview-md-sync-tasks/preview-sync-tasks.md \
            /tmp/preview-artifacts/preview-md-migrate-tasks/preview-migrate-tasks.md \
            /tmp/preview-artifacts/preview-md-connections/preview-connections.md
