name: TapData Deploy

on:
  push:
    branches: [main]
    paths:
      - '**/*tapdata_export/**'
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - sit
          - lpt
      project:
        description: 'Project name'
        required: true
        type: choice
        default: dmp
        options:
          - dmp

env:
  DEPLOY_DIR: /tmp/tapdata-deploy-${{ github.run_id }}
  # push 到 main 或创建 Tag 时使用 ref_name
  DEPLOY_REF: ${{ github.ref_name }}
  # push 到 main 时固定 dev；push 创建 Tag 时固定 sit；手动触发时使用 inputs.target_env
  TARGET_ENV: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'dev' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'sit' || inputs.target_env }}
  # 创建 Tag 触发时固定 dmp；其他场景默认 dmp 或使用手动输入
  PROJECT: ${{ inputs.project || 'dmp' }}

jobs:
  # ============================================================
  # Job 1: Preparation Phase
  # ============================================================
  preparation:
    name: Preparation Phase
    runs-on: self-hosted
    timeout-minutes: 5
    environment: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'dev' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'sit' || inputs.target_env }}
    outputs:
      tapdata_token: ${{ steps.get_token.outputs.tapdata_token }}
      target_env: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'dev' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'sit' || inputs.target_env }}
      tapdata_url: ${{ vars.TAPDATA_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate Input Parameters
        run: bash scripts/tapdata-deploy/validate-inputs.sh
        env:
          DEPLOYMENT_REF: ${{ env.DEPLOY_REF }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PROJECT: ${{ env.PROJECT }}

      - name: Get TapData Token
        id: get_token
        run: bash scripts/common/get-token.sh
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TAPDATA_ACCESSCODE: ${{ secrets.TAPDATA_ACCESS_CODE }}

      - name: Generate vault.json with Connection Secrets
        run: bash scripts/tapdata-deploy/generate-vault.sh
        env:
          PROJECT: ${{ env.PROJECT }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}

      - name: Upload vault and export files
        uses: actions/upload-artifact@v4
        with:
          name: vault-and-export
          path: |
            ${{ env.PROJECT }}_tapdata_export/vault.json
          retention-days: 1

  # ============================================================
  # Job 2: Preview All Resources
  # ============================================================
  preview-all:
    name: Preview All Resources
    runs-on: self-hosted
    timeout-minutes: 10
    needs: preparation
    outputs:
      connections_has_changes: ${{ steps.preview_connections.outputs.has_changes }}
      migrate_tasks_has_changes: ${{ steps.preview_migrate_tasks.outputs.has_changes }}
      sync_tasks_has_changes: ${{ steps.preview_sync_tasks.outputs.has_changes }}
      apis_has_changes: ${{ steps.preview_apis.outputs.has_changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Connections Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Connections
        id: preview_connections
        run: bash scripts/common/preview-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Compress Tasks Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview Migrate Tasks
        id: preview_migrate_tasks
        run: bash scripts/common/preview-resource.sh migrate/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Preview Sync Tasks
        id: preview_sync_tasks
        run: bash scripts/common/preview-resource.sh sync/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

      - name: Compress APIs Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Preview APIs
        id: preview_apis
        run: bash scripts/common/preview-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 3: Deploy Connections (requires approval)
  # ============================================================
  deploy-connections:
    name: Deploy Connections
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-all]
    if: needs.preview-all.outputs.connections_has_changes == 'true'
    outputs:
      changed_connections: ${{ steps.import_connections.outputs.changed_connections }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Connections via TapData API
        id: import_connections
        run: bash scripts/common/import-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 4: Deploy Migrate Tasks (requires approval)
  # ============================================================
  deploy-migrate-tasks:
    name: Deploy Migrate Tasks
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-all, deploy-connections]
    if: >-
      !cancelled()
      && needs.preparation.result == 'success'
      && needs.preview-all.result == 'success'
      && (needs.deploy-connections.result == 'success' || needs.deploy-connections.result == 'skipped')
      && needs.preview-all.outputs.migrate_tasks_has_changes == 'true'
    outputs:
      changed_migrate_tasks: ${{ steps.import_migrate_tasks.outputs.changed_migrate_tasks }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Migrate Tasks via TapData API
        id: import_migrate_tasks
        run: bash scripts/common/import-resource.sh migrate/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 5: Deploy Sync Tasks (requires approval)
  # ============================================================
  deploy-sync-tasks:
    name: Deploy Sync Tasks
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-all, deploy-connections, deploy-migrate-tasks]
    if: >-
      !cancelled()
      && needs.preparation.result == 'success'
      && needs.preview-all.result == 'success'
      && (needs.deploy-connections.result == 'success' || needs.deploy-connections.result == 'skipped')
      && (needs.deploy-migrate-tasks.result == 'success' || needs.deploy-migrate-tasks.result == 'skipped')
      && needs.preview-all.outputs.sync_tasks_has_changes == 'true'
    outputs:
      changed_sync_tasks: ${{ steps.import_sync_tasks.outputs.changed_sync_tasks }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Sync Tasks via TapData API
        id: import_sync_tasks
        run: bash scripts/common/import-resource.sh sync/tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 6: Deploy APIs (requires approval)
  # ============================================================
  deploy-apis:
    name: Deploy APIs
    runs-on: self-hosted
    timeout-minutes: 15
    environment: deploy
    needs: [preparation, preview-all, deploy-connections, deploy-migrate-tasks, deploy-sync-tasks]
    if: >-
      !cancelled()
      && needs.preparation.result == 'success'
      && needs.preview-all.result == 'success'
      && (needs.deploy-connections.result == 'success' || needs.deploy-connections.result == 'skipped')
      && (needs.deploy-migrate-tasks.result == 'success' || needs.deploy-migrate-tasks.result == 'skipped')
      && (needs.deploy-sync-tasks.result == 'success' || needs.deploy-sync-tasks.result == 'skipped')
      && needs.preview-all.outputs.apis_has_changes == 'true'
    outputs:
      changed_apis: ${{ steps.import_apis.outputs.changed_apis }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import APIs via TapData API
        id: import_apis
        run: bash scripts/common/import-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}

  # ============================================================
  # Job 7: Deploy Group Info
  # ============================================================
  deploy-group-info:
    name: Deploy Group Info
    runs-on: self-hosted
    timeout-minutes: 15
    needs: [preparation, preview-all, deploy-connections, deploy-migrate-tasks, deploy-sync-tasks, deploy-apis]
    if: >-
      !cancelled()
      && needs.preparation.result == 'success'
      && needs.preview-all.result == 'success'
      && (needs.deploy-connections.result == 'success' || needs.deploy-connections.result == 'skipped')
      && (needs.deploy-migrate-tasks.result == 'success' || needs.deploy-migrate-tasks.result == 'skipped')
      && (needs.deploy-sync-tasks.result == 'success' || needs.deploy-sync-tasks.result == 'skipped')
      && (needs.deploy-apis.result == 'success' || needs.deploy-apis.result == 'skipped')
    outputs:
      changed_groupInfo: ${{ steps.import_group_info.outputs.changed_groupInfo }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download vault artifact
        uses: actions/download-artifact@v4
        with:
          name: vault-and-export
          path: ${{ env.PROJECT }}_tapdata_export

      - name: Compress Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Group Info via TapData API
        id: import_group_info
        run: bash scripts/common/import-resource.sh groupInfo
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          TAPDATA_TOKEN: ${{ needs.preparation.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ needs.preparation.outputs.tapdata_url }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
