name: TapData Deploy Ops

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: choice
        default: dmp
        options:
          - dmp

env:
  DEPLOY_DIR: /tmp/tapdata-deploy-ops-${{ github.run_id }}
  DEPLOY_REF: ${{ github.ref_name }}
  PROJECT: ${{ inputs.project || 'dmp' }}

jobs:
  # ============================================================
  # Job 1: Preparation Phase
  # ============================================================
  preparation:
    name: Preparation Phase
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify Running on Tag
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "::error::Ops deployment must be triggered from a tag, not a branch. Current ref: ${{ github.ref_name }} (type: ${{ github.ref_type }})"
            exit 1
          fi
          echo "Running on tag: ${{ github.ref_name }}"

      - name: Validate Input Parameters
        run: bash scripts/tapdata-deploy/validate-inputs.sh
        env:
          DEPLOYMENT_REF: ${{ env.DEPLOY_REF }}
          TARGET_ENV: aat
          PROJECT: ${{ env.PROJECT }}

  # ============================================================
  # Job 2: Deploy AAT (All Resources in One Job)
  # ============================================================
  deploy-aat:
    name: Deploy AAT
    runs-on: self-hosted
    timeout-minutes: 30
    environment: aat
    needs: preparation
    outputs:
      changed_connections: ${{ steps.import_connections.outputs.changed_connections }}
      changed_tasks: ${{ steps.import_tasks.outputs.changed_tasks }}
      changed_apis: ${{ steps.import_apis.outputs.changed_apis }}
      changed_groupInfo: ${{ steps.import_group_info.outputs.changed_groupInfo }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Get AAT TapData Token
        id: get_aat_token
        run: bash scripts/common/get-token.sh
        env:
          TARGET_ENV: aat
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TAPDATA_ACCESSCODE: ${{ secrets.TAPDATA_ACCESS_CODE }}

      - name: Generate vault.json with Connection Secrets
        run: bash scripts/tapdata-deploy/generate-vault.sh
        env:
          PROJECT: ${{ env.PROJECT }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}

      - name: Compress Connections Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Connections via TapData API
        id: import_connections
        run: bash scripts/common/import-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ steps.get_aat_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: aat

      - name: Compress Tasks Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Tasks via TapData API
        id: import_tasks
        run: bash scripts/common/import-resource.sh tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ steps.get_aat_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: aat

      - name: Compress APIs Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import APIs via TapData API
        id: import_apis
        run: bash scripts/common/import-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ steps.get_aat_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: aat

      - name: Compress Group Info Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Group Info via TapData API
        id: import_group_info
        run: bash scripts/common/import-resource.sh groupInfo
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          TAPDATA_TOKEN: ${{ steps.get_aat_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: aat

  # ============================================================
  # Job 3: Prod Approval Gate
  # ============================================================
  prod-approval:
    name: Prod Approval
    runs-on: self-hosted
    timeout-minutes: 60
    environment: prod-approval
    needs: [deploy-aat]
    steps:
      - name: Approval Confirmed
        run: echo "Prod deployment approved. Proceeding to deploy..."

  # ============================================================
  # Job 4: Deploy Prod (All Resources in One Job)
  # ============================================================
  deploy-prod:
    name: Deploy Prod
    runs-on: self-hosted
    timeout-minutes: 30
    environment: prod
    needs: [prod-approval]
    outputs:
      prod_changed_connections: ${{ steps.import_connections.outputs.changed_connections }}
      prod_changed_tasks: ${{ steps.import_tasks.outputs.changed_tasks }}
      prod_changed_apis: ${{ steps.import_apis.outputs.changed_apis }}
      prod_changed_groupInfo: ${{ steps.import_group_info.outputs.changed_groupInfo }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Get Prod TapData Token
        id: get_prod_token
        run: bash scripts/common/get-token.sh
        env:
          TARGET_ENV: prod
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TAPDATA_ACCESSCODE: ${{ secrets.TAPDATA_ACCESS_CODE }}

      - name: Generate vault.json with Connection Secrets
        run: bash scripts/tapdata-deploy/generate-vault.sh
        env:
          PROJECT: ${{ env.PROJECT }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}

      - name: Compress Connections Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Connections via TapData API
        id: import_connections
        run: bash scripts/common/import-resource.sh connections
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: connections-export.tar
          TAPDATA_TOKEN: ${{ steps.get_prod_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: prod

      - name: Compress Tasks Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Tasks via TapData API
        id: import_tasks
        run: bash scripts/common/import-resource.sh tasks
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: tasks-export.tar
          TAPDATA_TOKEN: ${{ steps.get_prod_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: prod

      - name: Compress APIs Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import APIs via TapData API
        id: import_apis
        run: bash scripts/common/import-resource.sh apis
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: apis-export.tar
          TAPDATA_TOKEN: ${{ steps.get_prod_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: prod

      - name: Compress Group Info Export Files
        run: bash scripts/common/compress-files.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          PROJECT: ${{ env.PROJECT }}

      - name: Import Group Info via TapData API
        id: import_group_info
        run: bash scripts/common/import-resource.sh groupInfo
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          ARCHIVE_NAME: groupInfo-export.tar
          TAPDATA_TOKEN: ${{ steps.get_prod_token.outputs.tapdata_token }}
          TAPDATA_BASE_URL: ${{ vars.TAPDATA_URL }}
          TARGET_ENV: prod

  # ============================================================
  # Job 5: Generate Deployment Report
  # ============================================================
  generate-report:
    name: Generate Deployment Report
    runs-on: self-hosted
    timeout-minutes: 5
    if: always()
    needs: [preparation, deploy-aat, prod-approval, deploy-prod]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Collect Deployment Results
        run: bash scripts/tapdata-deploy/generate-report-ops.sh
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOYMENT_REF: ${{ env.DEPLOY_REF }}
          PROJECT: ${{ env.PROJECT }}
          GITHUB_ACTOR: ${{ github.actor }}
          # AAT results
          AAT_CHANGED_CONNECTIONS: ${{ needs.deploy-aat.outputs.changed_connections }}
          AAT_CHANGED_TASKS: ${{ needs.deploy-aat.outputs.changed_tasks }}
          AAT_CHANGED_APIS: ${{ needs.deploy-aat.outputs.changed_apis }}
          AAT_CHANGED_GROUP_INFO: ${{ needs.deploy-aat.outputs.changed_groupInfo }}
          # Prod results
          PROD_CHANGED_CONNECTIONS: ${{ needs.deploy-prod.outputs.prod_changed_connections }}
          PROD_CHANGED_TASKS: ${{ needs.deploy-prod.outputs.prod_changed_tasks }}
          PROD_CHANGED_APIS: ${{ needs.deploy-prod.outputs.prod_changed_apis }}
          PROD_CHANGED_GROUP_INFO: ${{ needs.deploy-prod.outputs.prod_changed_groupInfo }}
          # Job results
          PREPARATION_RESULT: ${{ needs.preparation.result }}
          AAT_CONNECTIONS_RESULT: ${{ needs.deploy-aat.result }}
          AAT_TASKS_RESULT: ${{ needs.deploy-aat.result }}
          AAT_APIS_RESULT: ${{ needs.deploy-aat.result }}
          AAT_GROUP_INFO_RESULT: ${{ needs.deploy-aat.result }}
          PROD_APPROVAL_RESULT: ${{ needs.prod-approval.result }}
          PROD_RESULT: ${{ needs.deploy-prod.result }}